<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Chefão Autopeças</title>
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#213F99;--accent:#FECF03;--success:#2ABC27;--text:#333;--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.container{max-width:1100px;margin:0 auto;width:100%;}

/* ===== LOGIN SCREEN ===== */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.login-box img{width:64px;margin-bottom:12px;}
.login-box h2{font-size:18px;font-weight:700;margin-bottom:4px;}
.login-box p{color:#999;font-size:13px;margin-bottom:24px;}
.login-box label{display:block;text-align:left;font-size:12px;font-weight:600;color:#666;margin-bottom:4px;}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:Inter,sans-serif;margin-bottom:16px;outline:none;transition:0.2s;}
.login-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(33,63,153,0.1);}
.login-box button{width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;transition:0.2s;}
.login-box button:hover{opacity:0.9;}
.login-box .error-msg{color:#ef4444;font-size:12px;margin-top:8px;display:none;}
.login-box .lock-icon{font-size:40px;color:var(--primary);margin-bottom:12px;display:block;}

/* ===== DASHBOARD ===== */
#dashboardContent{display:none;}
h1{font-size:22px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
h1 i{color:var(--primary);}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.period-select{display:flex;gap:6px;}
.period-select button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;font-weight:600;font-family:Inter,sans-serif;transition:0.2s;}
.period-select button.active{background:var(--primary);color:white;border-color:var(--primary);}
.logout-btn{padding:6px 14px;border:1px solid #ef4444;border-radius:6px;background:white;color:#ef4444;cursor:pointer;font-size:12px;font-weight:600;font-family:Inter,sans-serif;transition:0.2s;}
.logout-btn:hover{background:#fef2f2;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center;}
.card .icon{font-size:28px;margin-bottom:8px;}
.card .value{font-size:26px;font-weight:800;color:var(--text);}
.card .label{font-size:11px;color:#999;margin-top:4px;}
.card.purple .icon{color:#7c3aed;}
.card.green .icon{color:var(--success);}
.card.blue .icon{color:var(--primary);}
.card.orange .icon{color:#f59e0b;}
.card.red .icon{color:#ef4444;}
.card.teal .icon{color:#14b8a6;}
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
.section h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.section h3 i{color:var(--primary);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f0f0f0;}
th{color:#999;font-weight:600;font-size:11px;text-transform:uppercase;}
.empty{text-align:center;padding:30px;color:#999;font-size:13px;}
.loading{text-align:center;padding:40px;color:#999;}
.loading i{font-size:30px;margin-bottom:10px;display:block;}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
  <div class="login-box">
    <i class="fas fa-lock lock-icon"></i>
    <img src="../assets/logo.png" alt="Chefão">
    <h2>Dashboard Administrativo</h2>
    <p>Insira a senha de administrador para acessar as estatísticas.</p>
    <label for="adminPass">Senha</label>
    <input type="password" id="adminPass" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ===== DASHBOARD CONTENT ===== -->
<div class="container" id="dashboardContent">
  <div class="header-bar">
    <h1><i class="fas fa-chart-bar"></i> Chefão Autopeças — Dashboard</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <div class="period-select">
        <button onclick="loadStats(7)" id="p7">7 dias</button>
        <button onclick="loadStats(15)" id="p15">15 dias</button>
        <button class="active" onclick="loadStats(30)" id="p30">30 dias</button>
      </div>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
  </div>
  <div class="loading" id="loading"><i class="fas fa-spinner fa-spin"></i> Carregando estatísticas...</div>
  <div id="statsContent" style="display:none">
    <div class="grid" id="summaryCards"></div>
    <div class="section">
      <h3><i class="fas fa-calendar"></i> Últimos 7 dias</h3>
      <div class="grid" id="weekCards" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"></div>
    </div>
    <div class="section">
      <h3><i class="fas fa-table"></i> Detalhamento Diário</h3>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Data</th><th>Visitantes</th><th>Add Carrinho</th><th>Checkout</th><th>Vendas</th><th>Cadastros</th></tr></thead><tbody id="dailyTable"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
var AUTH_TOKEN = sessionStorage.getItem('chefao-admin-token');

function doLogin() {
  var pass = document.getElementById('adminPass').value.trim();
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!pass) { errEl.textContent = 'Digite a senha'; errEl.style.display = 'block'; return; }
  fetch('/.netlify/functions/admin-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data.ok && data.token) {
      AUTH_TOKEN = data.token;
      sessionStorage.setItem('chefao-admin-token', AUTH_TOKEN);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
      loadStats(30);
    } else {
      errEl.textContent = data.error || 'Senha incorreta';
      errEl.style.display = 'block';
    }
  })
  .catch(function(err){
    errEl.textContent = 'Erro de conexão: '+err.message;
    errEl.style.display = 'block';
  });
}

function doLogout() {
  AUTH_TOKEN = null;
  sessionStorage.removeItem('chefao-admin-token');
  document.getElementById('dashboardContent').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPass').value = '';
}

function loadStats(days) {
  if (!AUTH_TOKEN) return doLogout();
  document.querySelectorAll('.period-select button').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('p'+days).classList.add('active');
  document.getElementById('loading').style.display = 'block';
  document.getElementById('statsContent').style.display = 'none';
  fetch('/.netlify/functions/stats?days='+days+'&token='+encodeURIComponent(AUTH_TOKEN))
    .then(function(r){
      if (r.status === 401) { doLogout(); return null; }
      return r.json();
    })
    .then(function(data){
      if (!data) return;
      renderSummary(data);
      renderWeek(data);
      renderDaily(data);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('statsContent').style.display = 'block';
    })
    .catch(function(err){
      document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ef4444"></i><p>Erro ao carregar: '+err.message+'</p>';
    });
}

function renderSummary(data) {
  var s = data.summary || {};
  var cards = [
    {icon:'fa-users',color:'blue',value:s.total_visitors||0,label:'Visitantes'},
    {icon:'fa-shopping-cart',color:'purple',value:s.total_purchases||0,label:'Vendas'},
    {icon:'fa-dollar-sign',color:'green',value:'R$ '+(s.total_revenue||0).toFixed(2),label:'Faturamento'},
    {icon:'fa-user-plus',color:'orange',value:s.total_registrations||0,label:'Cadastros'},
  ];
  var html = '';
  cards.forEach(function(c){
    html += '<div class="card '+c.color+'"><div class="icon"><i class="fas '+c.icon+'"></i></div><div class="value">'+c.value+'</div><div class="label">'+c.label+'</div></div>';
  });
  document.getElementById('summaryCards').innerHTML = html;
}

function renderWeek(data) {
  var l7 = data.last7 || {};
  var cards = [
    {icon:'fa-eye',color:'blue',value:l7.pageview||0,label:'Visitas (7d)'},
    {icon:'fa-cart-plus',color:'purple',value:l7.add_to_cart||0,label:'Add Carrinho'},
    {icon:'fa-credit-card',color:'green',value:l7.purchase||0,label:'Compras'},
    {icon:'fa-ban',color:'red',value:Math.max(0,(l7.add_to_cart||0)-(l7.purchase||0)),label:'Abandonados'},
  ];
  var html = '';
  cards.forEach(function(c){
    html += '<div class="card '+c.color+'"><div class="icon"><i class="fas '+c.icon+'"></i></div><div class="value">'+c.value+'</div><div class="label">'+c.label+'</div></div>';
  });
  document.getElementById('weekCards').innerHTML = html;
}

function renderDaily(data) {
  var dates = Object.keys(data.daily || {}).sort().reverse();
  var html = '';
  dates.forEach(function(d){
    var day = data.daily[d] || {};
    html += '<tr><td>'+d+'</td><td>'+(day.pageview||0)+'</td><td>'+(day.add_to_cart||0)+'</td><td>'+(day.checkout_open||0)+'</td><td>'+(day.purchase||0)+'</td><td>'+(day.register||0)+'</td></tr>';
  });
  document.getElementById('dailyTable').innerHTML = html || '<tr><td colspan="6" class="empty">Nenhum dado disponível</td></tr>';
}

/* Auto-login if token exists */
if (AUTH_TOKEN) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
  loadStats(30);
}
</script>
</body>
</html>
